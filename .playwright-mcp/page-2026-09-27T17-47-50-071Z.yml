        - generic [ref=f3e32]:
          - heading "Fiza Engineering Corporation" [level=1] [ref=f3e33]
          - paragraph [ref=f3e34]: An integrated mining, heavy civil rail, and turnkey industrial engineering corporation founded in 1994, headquartered in Dubai with direct operating concessions across Africa.
      - generic [ref=f3e37]:
        - generic [ref=f3e38]:
          - heading "Heavy industrial operations across key African corridors." [level=2] [ref=f3e39]
          - generic [ref=f3e40]:
            - paragraph [ref=f3e41]: Established in 1994 by Muhammed Farooghuddin, Fiza Engineering Corporation develops arterial infrastructure, operates extraction concessions, and manages direct commodity supply chains connecting African resource basins to international markets.
            - paragraph [ref=f3e42]: Our operational scope includes direct open-pit mining in Mali and the Democratic Republic of Congo, heavy freight railway rehabilitation, and international physical mineral trading.
        - generic [ref=f3e43]:
          - img "Engineers reviewing site plans" [ref=f3e44]
          - generic [ref=f3e45]: Field engineers on site
      - generic [ref=f3e47]:
        - heading "Operating Principles" [level=2] [ref=f3e49]
        - generic [ref=f3e50]:
          - generic [ref=f3e52]:
            - heading "Direct control of equipment" [level=3] [ref=f3e53]
            - paragraph [ref=f3e54]: We own, maintain, and dispatch our heavy machinery fleet directly. On-site technical workshops and mobile field mechanics handle repairs immediately, keeping operations on schedule.
          - generic [ref=f3e56]:
            - heading "Local employment and technical training" [level=3] [ref=f3e57]
            - paragraph [ref=f3e58]: We invest in local workforce capacity. Over 90% of our on-site personnel and technical teams are recruited and trained within the sovereign jurisdictions where we operate.
          - generic [ref=f3e60]:
            - heading "Measured, reported operational results" [level=3] [ref=f3e61]
            - paragraph [ref=f3e62]: We track operational progress through verified metric tonnes extracted, kilometers of track ballasted, and machine operating hours logged without lost-time safety incidents.
          - generic [ref=f3e64]:
            - heading "Site restoration and watershed protection" [level=3] [ref=f3e65]
            - paragraph [ref=f3e66]: We integrate concurrent backfilling, topsoil preservation, and engineered drainage into active extraction plans to stabilize land contours and protect local hydrological systems.
