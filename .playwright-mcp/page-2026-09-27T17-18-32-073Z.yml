          - heading "Fiza Engineering Corporation" [level=1] [ref=f1e33]
          - paragraph [ref=f1e34]: An integrated mining, heavy civil rail, and turnkey industrial engineering corporation founded in 1994, headquartered in Dubai with direct operating concessions across Africa.
      - generic [ref=f1e37]:
        - generic [ref=f1e38]:
          - heading "Heavy industrial operations across key African corridors." [level=2] [ref=f1e39]
          - generic [ref=f1e40]:
            - paragraph [ref=f1e41]: Established in 1994 by Muhammed Farooghuddin, Fiza Engineering Corporation develops arterial infrastructure, operates extraction concessions, and manages direct commodity supply chains connecting African resource basins to international markets.
            - paragraph [ref=f1e42]: Our operational scope includes direct open-pit mining in Mali and the Democratic Republic of Congo, heavy freight railway rehabilitation, and international physical mineral trading.
        - generic [ref=f1e43]:
