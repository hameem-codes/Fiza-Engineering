        - generic [ref=f1e50]:
          - generic [ref=f1e52]:
            - heading "Direct control of equipment" [level=3] [ref=f1e53]
            - paragraph [ref=f1e54]: We own, maintain, and dispatch our heavy machinery fleet directly. On-site technical workshops and mobile field mechanics handle repairs immediately, keeping operations on schedule.
          - generic [ref=f1e56]:
            - heading "Local employment and technical training" [level=3] [ref=f1e57]
            - paragraph [ref=f1e58]: We invest in local workforce capacity. Over 90% of our on-site personnel and technical teams are recruited and trained within the sovereign jurisdictions where we operate.
          - generic [ref=f1e60]:
            - heading "Measured, reported operational results" [level=3] [ref=f1e61]
            - paragraph [ref=f1e62]: We track operational progress through verified metric tonnes extracted, kilometers of track ballasted, and machine operating hours logged without lost-time safety incidents.
          - generic [ref=f1e64]:
            - heading "Site restoration and watershed protection" [level=3] [ref=f1e65]
            - paragraph [ref=f1e66]: We integrate concurrent backfilling, topsoil preservation, and engineered drainage into active extraction plans to stabilize land contours and protect local hydrological systems.
