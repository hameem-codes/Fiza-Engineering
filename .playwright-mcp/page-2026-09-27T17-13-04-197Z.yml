          - heading "Fiza Engineering Corporation" [level=1] [ref=e33]
          - paragraph [ref=e34]: An integrated mining, heavy civil rail, and turnkey industrial engineering corporation founded in 1994, headquartered in Dubai with direct operating concessions across Africa.
