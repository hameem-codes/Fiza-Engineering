            - heading "Direct control of equipment" [level=3] [ref=e53]
            - paragraph [ref=e54]: We own, maintain, and dispatch our heavy machinery fleet directly. On-site technical workshops and mobile field mechanics handle repairs immediately, keeping operations on schedule.
          - generic [ref=e56]:
            - heading "Local employment and technical training" [level=3] [ref=e57]
            - paragraph [ref=e58]: We invest in local workforce capacity. Over 90% of our on-site personnel and technical teams are recruited and trained within the sovereign jurisdictions where we operate.
          - generic [ref=e60]:
            - heading "Measured, reported operational results" [level=3] [ref=e61]
            - paragraph [ref=e62]: We track operational progress through verified metric tonnes extracted, kilometers of track ballasted, and machine operating hours logged without lost-time safety incidents.
