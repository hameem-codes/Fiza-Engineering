        - generic [ref=f12e25]:
          - heading "Fiza Engineering Corporation" [level=1] [ref=f12e26]
          - paragraph [ref=f12e27]: An integrated mining, heavy civil rail, and turnkey industrial engineering corporation founded in 1994, headquartered in Dubai with direct operating concessions across Africa.
      - generic [ref=f12e30]:
        - generic [ref=f12e31]:
          - heading "Heavy industrial operations across key African corridors." [level=2] [ref=f12e32]
          - generic [ref=f12e33]:
            - paragraph [ref=f12e34]: Established in 1994 by Muhammed Farooghuddin, Fiza Engineering Corporation develops arterial infrastructure, operates extraction concessions, and manages direct commodity supply chains connecting African resource basins to international markets.
            - paragraph [ref=f12e35]: Our operational scope includes direct open-pit mining in Mali and the Democratic Republic of Congo, heavy freight railway rehabilitation, and international physical mineral trading.
        - generic [ref=f12e36]:
          - img "Engineers reviewing site plans" [ref=f12e37]
          - generic [ref=f12e38]: Field engineers on site
      - generic [ref=f12e40]:
        - heading "Operating Principles" [level=2] [ref=f12e42]
        - generic [ref=f12e43]:
          - generic [ref=f12e45]:
            - heading "Direct control of equipment" [level=3] [ref=f12e46]
            - paragraph [ref=f12e47]: We own, maintain, and dispatch our heavy machinery fleet directly. On-site technical workshops and mobile field mechanics handle repairs immediately, keeping operations on schedule.
          - generic [ref=f12e49]:
            - heading "Local employment and technical training" [level=3] [ref=f12e50]
            - paragraph [ref=f12e51]: We invest in local workforce capacity. Over 90% of our on-site personnel and technical teams are recruited and trained within the sovereign jurisdictions where we operate.
          - generic [ref=f12e53]:
            - heading "Measured, reported operational results" [level=3] [ref=f12e54]
            - paragraph [ref=f12e55]: We track operational progress through verified metric tonnes extracted, kilometers of track ballasted, and machine operating hours logged without lost-time safety incidents.
          - generic [ref=f12e57]:
            - heading "Site restoration and watershed protection" [level=3] [ref=f12e58]
            - paragraph [ref=f12e59]: We integrate concurrent backfilling, topsoil preservation, and engineered drainage into active extraction plans to stabilize land contours and protect local hydrological systems.
